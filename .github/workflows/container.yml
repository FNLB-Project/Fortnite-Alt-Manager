# From https://github.com/JSPaste/Backend

name: 'Container'
on:
    workflow_dispatch:
        inputs:
            allow_vulnerable:
                description: 'Push even if a fixable critical vulnerability is found'
                type: boolean
                default: false
    push:
        branches:
            - stable

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        if: ${{ github.repository_owner == 'FNLB-Project' }}
        name: 'Build container image'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            packages: write

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: 'Checkout'
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: 'Setup tags'
              id: setup-tags
              run: |
                  TIMESTAMP="$(date +%Y.%m.%d)"
                  SHA_SHORT="${GITHUB_SHA::7}"

                  TAGS=()
                  TAGS+=("latest")
                  TAGS+=("${GITHUB_SHA}")
                  TAGS+=("${TIMESTAMP}-${SHA_SHORT}")

                  echo "build-tags=${TAGS[*]}" >> $GITHUB_OUTPUT

            - name: 'Build image'
              id: build-image
              uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # master
              with:
                  archs: amd64
                  containerfiles: Dockerfile
                  image: ${{ env.IMAGE_NAME }}
                  layers: true
                  tags: ${{ steps.setup-tags.outputs.build-tags }}

            - name: 'Export image for scanning'
              run: buildah push "${{ steps.build-image.outputs.image-with-tag }}" "oci-archive:${RUNNER_TEMP}/image.tar"

            - name: 'Generate SBOM'
              uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  image: oci-archive:${{ runner.temp }}/image.tar
                  format: spdx-json
                  output-file: ${{ runner.temp }}/sbom.spdx.json
                  artifact-name: sbom.spdx.json
                  upload-artifact-retention: 30

            # Blocks the push on a critical vulnerability that already has a fix. Run the workflow manually with allow_vulnerable to override.
            - name: 'Scan image for vulnerabilities'
              uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
              with:
                  sbom: ${{ runner.temp }}/sbom.spdx.json
                  fail-build: ${{ inputs.allow_vulnerable != true }}
                  severity-cutoff: critical
                  only-fixed: true

            - name: 'Push to GHCR'
              id: push
              uses: redhat-actions/push-to-registry@9986a6552bc4571882a4a67e016b17361412b4df # v2.7.1
              env:
                  REGISTRY_USER: ${{ github.actor }}
                  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

              with:
                  image: ${{ steps.build-image.outputs.image }}
                  tags: ${{ steps.build-image.outputs.tags }}
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.REGISTRY_USER }}
                  password: ${{ env.REGISTRY_PASSWORD }}

            - name: 'Install cosign'
              uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Keyless signature (GitHub OIDC) plus the SBOM as an attestation, both stored next to the image in GHCR.
            - name: 'Sign image and attest SBOM'
              env:
                  DIGEST: ${{ steps.push.outputs.digest }}
                  REGISTRY_PATH: ${{ steps.push.outputs.registry-path }}
                  REGISTRY_USER: ${{ github.actor }}
                  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "${REGISTRY_PASSWORD}" | cosign login ghcr.io -u "${REGISTRY_USER}" --password-stdin
                  # The public Sigstore log has short outages (HTTP 502): retry instead of leaving a pushed image unsigned.
                  retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt ${i} failed, retrying"; sleep $((i * 20)); done; return 1; }
                  REF="${REGISTRY_PATH%%:*}@${DIGEST}"
                  retry cosign sign --yes "${REF}"
                  retry cosign attest --yes --type spdxjson --predicate "${RUNNER_TEMP}/sbom.spdx.json" "${REF}"
